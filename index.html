<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a0a2e">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="apple-mobile-web-app-title" content="男鬼">
  <title>男鬼</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1a0a2e;
      --bg2:     #120720;
      --purple:  #7b2fff;
      --purple2: #c44aff;
      --text:    #e8d5ff;
      --dim:     #b47cff;
      --ghost-bubble: rgba(255,255,255,0.07);
      --border:  rgba(180,100,255,0.18);
    }

    html, body {
      height: 100%; height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%; height: 100dvh;
    }

    /* ── header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(18,7,32,0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
      padding-top: max(12px, env(safe-area-inset-top));
    }

    .ava {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 18px rgba(180,80,255,0.45);
      animation: glow 3s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes glow {
      0%,100% { box-shadow: 0 0 10px rgba(180,80,255,0.3); }
      50%      { box-shadow: 0 0 26px rgba(180,80,255,0.65); }
    }

    .hdr-name { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
    .hdr-sub  { font-size: 11px; color: var(--dim); margin-top: 2px; }

    /* ── messages ── */
    #msgs {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }
    #msgs::-webkit-scrollbar { display: none; }

    .row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      max-width: 80%;
    }
    .row.ghost { align-self: flex-start; }
    .row.user  { align-self: flex-end; flex-direction: row-reverse; }

    .row-ava {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(180,80,255,0.3);
    }

    .col { display: flex; flex-direction: column; gap: 3px; }

    .bubble {
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .ghost .bubble {
      background: var(--ghost-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .user .bubble {
      background: linear-gradient(135deg, #6118e0, #9b40ff);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 14px rgba(97,24,224,0.4);
    }

    .ts {
      font-size: 10px;
      color: rgba(180,140,255,0.4);
      padding: 0 3px;
    }
    .ghost .ts { align-self: flex-start; }
    .user  .ts { align-self: flex-end; }

    /* ── typing ── */
    #typing {
      display: none;
      align-self: flex-start;
      margin-left: 38px;
      padding: 9px 14px;
      background: var(--ghost-bubble);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }
    .dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--dim);
      margin: 0 2px;
      animation: bounce 1.3s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); opacity: .5; }
      40%          { transform: translateY(-6px); opacity: 1; }
    }

    /* ── input ── */
    footer {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: rgba(12,4,24,0.95);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #inp {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(180,100,255,0.22);
      border-radius: 18px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.4;
      max-height: 96px;
      transition: border-color .2s;
    }
    #inp::placeholder { color: rgba(180,140,255,0.32); }
    #inp:focus { border-color: rgba(180,100,255,0.52); }

    #send {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px rgba(123,47,255,0.4);
      transition: transform .1s, opacity .1s;
      -webkit-tap-highlight-color: transparent;
    }
    #send:active { transform: scale(.91); opacity: .82; }

    /* ── image ── */
    #img-preview-bar {
      display: none;
      padding: 8px 12px;
      background: rgba(12,4,24,.97);
      border-top: 1px solid var(--border);
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #img-preview-bar.show { display: flex; }
    #img-thumb {
      width: 52px; height: 52px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    #img-clear {
      background: none; border: none;
      color: var(--dim); font-size: 20px; cursor: pointer;
      margin-left: auto;
    }
    #img-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      font-size: 17px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }
    #img-btn:active { background: rgba(123,47,255,.25); }

    /* user image bubble */
    .img-bubble {
      max-width: 180px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: block;
    }

    #sticker-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }
    #sticker-btn:active { background: rgba(123,47,255,.25); }

    #mic-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, border-color .15s;
    }
    #mic-btn:active { background: rgba(123,47,255,.25); }
    #mic-btn.listening {
      background: rgba(210,40,40,.25);
      border-color: rgba(210,40,40,.5);
      animation: mic-pulse 1s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(210,40,40,.45); }
      50%      { box-shadow: 0 0 0 7px rgba(210,40,40,0); }
    }

    /* ── bubble long-press menu ── */
    #bubble-menu {
      position: fixed;
      display: none;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      z-index: 400;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      min-width: 150px;
    }
    .bm-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 16px;
      font-size: 14px;
      color: var(--text);
      border-radius: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .bm-btn:active { background: rgba(255,255,255,.1); }
    #bm-mask {
      position: fixed; inset: 0; z-index: 399; display: none;
    }

    /* ── toast ── */
    #mem-toast {
      position: fixed;
      bottom: 90px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--purple);
      color: #fff;
      padding: 9px 20px;
      border-radius: 22px;
      font-size: 14px;
      opacity: 0; pointer-events: none;
      transition: opacity .22s, transform .22s;
      z-index: 500;
      white-space: nowrap;
    }
    #mem-toast.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    #sticker-tray {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 0; right: 0;
      background: rgba(18,7,32,.97);
      border-top: 1px solid var(--border);
      padding: 12px 14px;
    }
    #sticker-tray.show { display: block; }
    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
    }
    .sticker-item {
      font-size: 26px;
      text-align: center;
      cursor: pointer;
      padding: 4px 0;
      border-radius: 8px;
      transition: background .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .sticker-item:active { background: rgba(123,47,255,.3); }

    /* big sticker bubble */
    .bubble.sticker-bubble {
      background: transparent !important;
      border: none !important;
      font-size: 52px;
      padding: 2px 6px;
      line-height: 1.1;
    }

    /* ── drawer menu ── */
    #menu-btn {
      margin-left: auto;
      background: none; border: none;
      color: var(--dim); font-size: 22px;
      cursor: pointer; padding: 4px 6px;
      -webkit-tap-highlight-color: transparent;
      line-height: 1;
    }
    #menu-btn:active { color: var(--text); }

    #drawer-mask {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 150;
    }
    #drawer-mask.show { display: block; }

    #drawer {
      position: fixed; top: 0; right: -280px; bottom: 0;
      width: 260px;
      background: #120720;
      border-left: 1px solid var(--border);
      z-index: 160;
      display: flex; flex-direction: column;
      padding-top: max(18px, env(safe-area-inset-top));
      transition: right .25s cubic-bezier(.4,0,.2,1);
      overflow-y: auto;
    }
    #drawer.open { right: 0; }

    .drawer-avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      margin: 0 auto 10px;
      box-shadow: 0 0 24px rgba(123,47,255,.4);
    }
    .drawer-name {
      text-align: center; font-size: 15px; font-weight: 600;
      margin-bottom: 4px;
    }
    .drawer-sub {
      text-align: center; font-size: 11px; color: var(--dim);
      margin-bottom: 20px;
    }

    .drawer-divider {
      height: 1px; background: var(--border);
      margin: 4px 16px 10px;
    }
    .drawer-section-title {
      font-size: 10px; color: rgba(180,140,255,.4);
      letter-spacing: .08em; text-transform: uppercase;
      padding: 0 20px; margin-bottom: 6px;
    }

    .drawer-item {
      display: flex; align-items: center;
      gap: 12px;
      padding: 12px 20px;
      cursor: pointer;
      transition: background .15s;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .drawer-item:active { background: rgba(123,47,255,.15); }
    .drawer-icon { font-size: 20px; flex-shrink: 0; }
    .drawer-label { font-size: 14px; }
    .drawer-badge {
      display: none;
      margin-left: auto;
      background: var(--purple2);
      color: #fff; font-size: 10px;
      border-radius: 10px; padding: 1px 6px;
    }
    .drawer-badge.show { display: block; }

    /* ── stats panel ── */
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; padding: 8px 16px 16px;
    }
    .stat-box {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
    }
    .stat-num { font-size: 22px; font-weight: 700; color: var(--purple2); }
    .stat-lbl { font-size: 10px; color: var(--dim); margin-top: 2px; }

    /* ── check-in ── */
    /* ci-btn moved to drawer */

    #ci-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(10,3,20,.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #ci-overlay.show { display: flex; }

    .ci-card {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 20px 22px;
      width: min(310px, 90vw);
      text-align: center;
    }
    .ci-title { font-size: 15px; color: var(--dim); margin-bottom: 20px; }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .mood-btn {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 2px 8px;
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      transition: background .15s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .mood-btn:active, .mood-btn.sel {
      background: rgba(123,47,255,.3);
      border-color: var(--purple);
    }
    .mood-btn .em { font-size: 26px; }
    .mood-btn .lb { font-size: 10px; color: var(--dim); }

    #ci-note {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      margin-bottom: 14px;
    }
    #ci-note::placeholder { color: rgba(180,140,255,.3); }

    #ci-submit {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    #ci-cancel {
      display: block; margin-top: 10px;
      background: none; border: none;
      color: var(--dim); font-size: 13px; cursor: pointer;
    }

    /* ── letters ── */
    /* lt-btn moved to drawer */

    #lt-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(10,3,20,.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 200;
      align-items: flex-start;
      justify-content: center;
      padding-top: max(50px, env(safe-area-inset-top));
      overflow-y: auto;
    }
    #lt-overlay.show { display: flex; }

    .lt-card {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px 20px;
      width: min(380px, 92vw);
      margin-bottom: 40px;
    }
    .lt-head {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .lt-head-title { font-size: 15px; font-weight: 600; }
    .lt-close { background: none; border: none; color: var(--dim); font-size: 20px; cursor: pointer; }

    .lt-empty { color: var(--dim); font-size: 13px; text-align: center; padding: 20px 0; }

    .lt-item {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background .15s;
    }
    .lt-item:active { background: rgba(123,47,255,.15); }
    .lt-item-date { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
    .lt-item-preview {
      font-size: 14px; line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--text);
    }

    .lt-full {
      display: none;
      position: fixed; inset: 0;
      background: rgba(10,3,20,.95);
      z-index: 210;
      overflow-y: auto;
      padding: max(50px, env(safe-area-inset-top)) 20px 40px;
      align-items: flex-start;
      justify-content: center;
    }
    .lt-full.show { display: flex; }
    .lt-full-inner {
      width: min(400px, 92vw);
    }
    .lt-full-back {
      background: none; border: none;
      color: var(--dim); font-size: 13px;
      cursor: pointer; margin-bottom: 16px;
      padding: 0;
    }
    .lt-full-date { font-size: 11px; color: var(--dim); margin-bottom: 14px; }
    .lt-full-body {
      font-size: 15px; line-height: 1.9;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── countdown ── */
    /* cd-btn moved to drawer */

    #cd-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(10,3,20,.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 200;
      align-items: flex-start;
      justify-content: center;
      padding-top: max(60px, env(safe-area-inset-top));
      overflow-y: auto;
    }
    #cd-overlay.show { display: flex; }

    .cd-card {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px 18px;
      width: min(340px, 92vw);
      margin-bottom: 40px;
    }
    .cd-head {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .cd-head-title { font-size: 15px; font-weight: 600; }
    .cd-close { background: none; border: none; color: var(--dim); font-size: 20px; cursor: pointer; }

    .cd-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .cd-item {
      display: flex; align-items: center;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      gap: 10px;
    }
    .cd-item-info { flex: 1; }
    .cd-item-name { font-size: 14px; }
    .cd-item-days { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .cd-item-days.today { color: var(--purple2); }
    .cd-del { background: none; border: none; color: rgba(255,100,100,.5); font-size: 16px; cursor: pointer; }

    .cd-add { border-top: 1px solid var(--border); padding-top: 14px; }
    .cd-add-title { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
    .cd-inp {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      margin-bottom: 8px;
    }
    .cd-inp::-webkit-calendar-picker-indicator { filter: invert(.7); }
    .cd-save {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    /* ── mood chart ── */
    .mood-chart {
      display: flex; gap: 6px;
      padding: 6px 16px 18px;
      justify-content: space-between;
    }
    .mood-day {
      display: flex; flex-direction: column;
      align-items: center; gap: 5px;
      flex: 1;
    }
    .mood-dot {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      transition: transform .1s;
    }
    .mood-dot.filled { border-color: transparent; }
    .mood-dot:active { transform: scale(.88); }
    .mood-day-lbl {
      font-size: 10px; color: var(--dim);
      letter-spacing: .02em;
    }

    /* ── memories overlay ── */
    #mem-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(10,3,20,.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 200;

<script>
// ── bg particles ─────────────────────────────────────────────────────────────
;(function () {
  const bg = document.getElementById('bg')
  const cols = ['#7b2fff','#c44aff','#a035f0','#5c10c8']
  for (let i = 0; i < 10; i++) {
    const el = document.createElement('div')

      `width:${s}px;height:${s}px;left:${Math.random()*100}%;` +
      `background:${cols[i % cols.length]};` +
      `animation-duration:${Math.random()*18+12}s;` +
      `animation-delay:${Math.random()*14}s`
    bg.appendChild(el)
  }
})()

// ── state ─────────────────────────────────────────────────────────────────────
let latestId = 0
let busy = false

const msgsEl  = document.getElementById('msgs')
const inp     = document.getElementById('inp')
const typing  = document.getElementById('typing')
const statusEl = document.getElementById('status')

// ── utils ─────────────────────────────────────────────────────────────────────
function fmt(ts) {
  const d = new Date(ts * 1000)
  return d.getHours().toString().padStart(2, '0') + ':' +
         d.getMinutes().toString().padStart(2, '0')
}

function escape(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}

function addBubble(role, text, ts, id) {
  if (id && document.querySelector(`[data-id="${id}"]`)) return

  const isUser = role === 'user'
  const wrap = document.createElement('div')
  wrap.className = `row ${isUser ? 'user' : 'ghost'}`
  if (id) wrap.dataset.id = String(id)

  const stickerClass = isSticker(text) ? ' sticker-bubble' : ''
  wrap.innerHTML = (!isUser ? '<div class="row-ava">👻</div>' : '') +
    `<div class="col">` +
      `<div class="bubble${stickerClass}">${escape(text).replace(/\n/g,'<br>')}</div>` +
      `<div class="ts">${ts ? fmt(ts) : '刚刚'}</div>` +
    `</div>`

  // attach long-press to bubble
  const bubbleEl = wrap.querySelector('.bubble')
  if (bubbleEl) attachLongPress(bubbleEl, text)

  msgsEl.appendChild(wrap)
  msgsEl.scrollTop = msgsEl.scrollHeight
  if (id && id > latestId) latestId = id
}

function showTyping(v) {
  typing.style.display = v ? 'block' : 'none'
  if (v) msgsEl.scrollTop = msgsEl.scrollHeight
}

// ── send ──────────────────────────────────────────────────────────────────────
async function doSend() {
  const text = inp.value.trim()
  const img  = pendingImg
  if (!text && !img || busy) return
  busy = true
  inp.value = ''
  inp.style.height = 'auto'
  statusEl.textContent = '正在回应…'
  clearImg()

  // Show user bubble (image thumbnail if present)
  if (img) {
    const wrapU = document.createElement('div')
    wrapU.className = 'row user'
    wrapU.innerHTML =
      `<div class="col">` +
        `<img class="img-bubble" src="data:${img.type};base64,${img.data}">` +
        (text ? `<div class="bubble" style="margin-top:4px">${escape(text)}</div>` : '') +
        `<div class="ts">刚刚</div>` +
      `</div>`
    msgsEl.appendChild(wrapU)
    msgsEl.scrollTop = msgsEl.scrollHeight
  } else {
    addBubble('user', text, Date.now() / 1000, null)
  }
  showTyping(true)

  const body = { message: text }
  if (img) body.image = img

  try {
    const r = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })

    // 第一个字节到了就隐藏 typing，建空气泡
    showTyping(false)
    const wrapEl = document.createElement('div')
    wrapEl.className = 'row ghost'
    wrapEl.innerHTML =
      '<div class="row-ava">👻</div>' +
      '<div class="col"><div class="bubble"></div><div class="ts">刚刚</div></div>'
    msgsEl.appendChild(wrapEl)
    const bubbleEl = wrapEl.querySelector('.bubble')
    msgsEl.scrollTop = msgsEl.scrollHeight

    const reader = r.body.getReader()
    const decoder = new TextDecoder()
    let buf = '', fullText = ''

    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      buf += decoder.decode(value, { stream: true })
      const lines = buf.split('\n')
      buf = lines.pop()
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue
        try {
          const ev = JSON.parse(line.slice(6))
          if (ev.t) {
            fullText += ev.t
            bubbleEl.textContent = fullText
            msgsEl.scrollTop = msgsEl.scrollHeight
          }
          if (ev.done && ev.id) {
            wrapEl.dataset.id = String(ev.id)
            if (ev.id > latestId) latestId = ev.id
          }
          if (ev.e) {
            bubbleEl.textContent = fullText || '…（信号断了）'
          }
        } catch (_) {}
      }
    }

    statusEl.textContent = '在附近游荡…'
  } catch (e) {
    showTyping(false)
    addBubble('assistant', '…（信号断了）', Date.now() / 1000, null)
    statusEl.textContent = '连接中断'
  }
  busy = false
}

// ── textarea auto-resize ──────────────────────────────────────────────────────
inp.addEventListener('input', () => {
  inp.style.height = 'auto'
  inp.style.height = Math.min(inp.scrollHeight, 96) + 'px'
})
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend() }
})

// ── poll for proactive messages ───────────────────────────────────────────────
async function poll() {
  try {
    const r = await fetch(`/messages?since=${latestId}`)
    const d = await r.json()
    for (const m of d.messages) {
      if (m.role === 'assistant') addBubble(m.role, m.content, m.ts, m.id)
      if (m.id > latestId) latestId = m.id
    }
    if (d.latest > latestId) latestId = d.latest
  } catch (e) {}
}
setInterval(poll, 3000)

      body: JSON.stringify({ app: '男鬼系统(浏览器)', action }),
    })
  } catch (e) {}
}

document.addEventListener('visibilitychange', () => {

// ── web push ──────────────────────────────────────────────────────────────────
async function initNotif() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) return
  const badge = document.getElementById('notif-badge')
  if (Notification.permission === 'granted') {
    const reg = await navigator.serviceWorker.ready
    const sub = await reg.pushManager.getSubscription()
    if (sub) { badge.textContent = '已开启'; badge.style.background = '#2d9e5f'; return }
  }
  if (Notification.permission === 'denied') { badge.textContent = '已拒绝'; return }
}

async function toggleNotif() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) {
    alert('当前浏览器不支持推送通知'); return
  }
  const badge = document.getElementById('notif-badge')
  const reg = await navigator.serviceWorker.ready
  const existing = await reg.pushManager.getSubscription()

  if (existing) {
    // 已订阅 → 取消
    await fetch('/push/unsubscribe', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ endpoint: existing.endpoint }),
    })
    await existing.unsubscribe()
    badge.textContent = '未开启'; badge.style.background = ''
    return
  }

  // 申请权限
  const perm = await Notification.requestPermission()
  if (perm !== 'granted') { badge.textContent = '已拒绝'; return }

  // 获取 VAPID 公钥
  const kRes = await fetch('/push/vapid-public-key')
  const { publicKey } = await kRes.json()

  // 订阅
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: _urlB64ToUint8(publicKey),
  })
  await fetch('/push/subscribe', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(sub.toJSON()),
  })
  badge.textContent = '已开启'; badge.style.background = '#2d9e5f'
}

function _urlB64ToUint8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4)
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'))
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)))
}

initNotif()

// ── bubble long-press ─────────────────────────────────────────────────────────
let lpTimer = null
let lpText = ''
let lpTouch = null

function attachLongPress(el, text) {
  el.addEventListener('touchstart', e => {
    lpText = text
    lpTouch = e.touches[0]
    lpTimer = setTimeout(() => showBubbleMenu(lpTouch), 550)
  }, { passive: true })
  el.addEventListener('touchmove', () => clearTimeout(lpTimer), { passive: true })
  el.addEventListener('touchend', () => clearTimeout(lpTimer), { passive: true })
  el.addEventListener('contextmenu', e => {
    e.preventDefault()
    lpText = text
    showBubbleMenu({ clientX: e.clientX, clientY: e.clientY })
  })
}

function showBubbleMenu(touch) {
  navigator.vibrate && navigator.vibrate(35)
  const menu = document.getElementById('bubble-menu')
  const mask = document.getElementById('bm-mask')
  const vw = window.innerWidth, vh = window.innerHeight
  menu.style.display = 'block'
  mask.style.display = 'block'
  const mw = menu.offsetWidth || 160
  const mh = menu.offsetHeight || 100
  const x = Math.min(touch.clientX, vw - mw - 10)
  const y = Math.max(touch.clientY - mh - 12, 10)
  menu.style.left = x + 'px'
  menu.style.top  = y + 'px'
}

function closeBubbleMenu() {
  document.getElementById('bubble-menu').style.display = 'none'
  document.getElementById('bm-mask').style.display = 'none'
}

async function saveAsMemory() {
  closeBubbleMenu()
  try {
    await fetch('/memory', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: lpText }),
    })
    showMemToast('已保存为记忆 💜')
  } catch (_) {
    showMemToast('保存失败，请重试')
  }
}

function copyBubble() {
  closeBubbleMenu()
  navigator.clipboard.writeText(lpText).then(
    () => showMemToast('已复制 ✓'),
    () => showMemToast('复制失败')
  )
}

let toastTimer = null
function showMemToast(msg) {
  const t = document.getElementById('mem-toast')
  t.textContent = msg
  t.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200)
}

// ── memories UI ───────────────────────────────────────────────────────────────
function openMemories() {
  document.getElementById('mem-overlay').classList.add('show')
  loadMemories()
}
function closeMemories() {
  document.getElementById('mem-overlay').classList.remove('show')
}

async function loadMemories() {
  const list = document.getElementById('mem-list')
  list.innerHTML = '<div class="mem-empty">加载中…</div>'
  try {
    const r = await fetch('/memories')
    const d = await r.json()
    if (!d.memories.length) {
      list.innerHTML = '<div class="mem-empty">还没有记忆，长按对话气泡可保存</div>'
      return
    }
    list.innerHTML = d.memories.map(m => `
      <div class="mem-item" id="mem-${m.id}">
        <div class="mem-text">${escape(m.content)}</div>
        <button class="mem-del" onclick="deleteMem(${m.id})" title="删除">✕</button>
      </div>`).join('')
  } catch (_) {
    list.innerHTML = '<div class="mem-empty">加载失败</div>'
  }
}

async function deleteMem(id) {
  await fetch(`/memory/${id}`, { method: 'DELETE' })
  const el = document.getElementById(`mem-${id}`)
  if (el) el.remove()
  const list = document.getElementById('mem-list')
  if (!list.children.length) {
    list.innerHTML = '<div class="mem-empty">还没有记忆，长按对话气泡可保存</div>'
  }
}

// ── themes ────────────────────────────────────────────────────────────────────
const THEMES = {
  '幽灵': {
    '--bg':'#1a0a2e','--bg2':'#120720',
    '--purple':'#7b2fff','--purple2':'#c44aff',
    '--text':'#e8d5ff','--dim':'#b47cff',

function applyTheme(name) {
  const t = THEMES[name]; if (!t) return
  const r = document.documentElement
  for (const [k, v] of Object.entries(t)) {
    if (k.startsWith('--')) r.style.setProperty(k, v)
  }
  const tc = document.querySelector('meta[name="theme-color"]')
  if (tc) tc.content = t['--bg']
  localStorage.setItem('theme', name)
  document.querySelectorAll('.swatch').forEach(s =>
    s.classList.toggle('active', s.dataset.name === name))
}

function buildThemeRow() {
  const row = document.getElementById('theme-row')
  const saved = localStorage.getItem('theme') || '幽灵'
  row.innerHTML = ''
  for (const [name, t] of Object.entries(THEMES)) {
    const b = document.createElement('div')
    b.className = 'swatch' + (name === saved ? ' active' : '')
    b.dataset.name = name
    b.title = name
    b.style.background = t.swatch
    b.onclick = () => applyTheme(name)
    row.appendChild(b)
  }
}

const MOOD_META = {
  '很好':  { em: '😊', color: '#3dba5e' },
  '还行':  { em: '😐', color: '#c8b820' },
  '有点累':{ em: '😮‍💨', color: '#e07830' },
  '难过':  { em: '😢', color: '#3a8fdd' },
  '烦躁':  { em: '😤', color: '#dd4444' },
}

async function loadStats() {
  try {
    const [sr, cr] = await Promise.all([fetch('/stats'), fetch('/checkins?limit=30')])
    const d = await sr.json()
    document.getElementById('s-msgs').textContent   = d.messages
    document.getElementById('s-days').textContent   = d.days
    document.getElementById('s-checks').textContent = d.checkins
    document.getElementById('s-letts').textContent  = d.letters

    const cd = await cr.json()
    renderMoodChart(cd.checkins)
  } catch (_) {}
}

function renderMoodChart(checkins) {
  const chart = document.getElementById('mood-chart')
  // build map: CST date string → mood
  const byDate = {}
  for (const c of checkins) {
    const cst = new Date((c.ts + 8 * 3600) * 1000)
    const key = `${cst.getUTCFullYear()}-${cst.getUTCMonth()}-${cst.getUTCDate()}`
    if (!byDate[key]) byDate[key] = c  // most recent per day
  }

  const days = ['日','一','二','三','四','五','六']
  const cols = []
  for (let i = 6; i >= 0; i--) {
    const d = new Date(Date.now() + 8 * 3600000 - i * 86400000)
    const key = `${d.getUTCFullYear()}-${d.getUTCMonth()}-${d.getUTCDate()}`
    const entry = byDate[key]
    const meta = entry ? MOOD_META[entry.mood] : null
    const dotStyle = meta
      ? `background:${meta.color};` : ''
    const title = entry ? `${entry.mood}${entry.note ? ' · ' + entry.note : ''}` : '未打卡'
    cols.push(
      `<div class="mood-day" title="${escape(title)}">` +
        `<div class="mood-dot${meta ? ' filled' : ''}" style="${dotStyle}">` +
          (meta ? meta.em : '') +
        `</div>` +
        `<div class="mood-day-lbl">${days[d.getUTCDay()]}</div>` +
      `</div>`
    )
  }
  chart.innerHTML = cols.join('')
}

// ── image ─────────────────────────────────────────────────────────────────────
let pendingImg = null   // {data: base64, type: 'image/jpeg'}

function clearImg() {
  pendingImg = null
  document.getElementById('img-preview-bar').classList.remove('show')
  document.getElementById('img-input').value = ''
}

async function onImgSelect(e) {
  const file = e.target.files[0]
  if (!file) return
  pendingImg = await resizeImage(file)
  document.getElementById('img-thumb').src =
    `data:${pendingImg.type};base64,${pendingImg.data}`
  document.getElementById('img-preview-bar').classList.add('show')
  // close sticker tray if open
  document.getElementById('sticker-tray').classList.remove('show')
}

function resizeImage(file, maxW = 800) {
  return new Promise(resolve => {
    const img = new Image()
    const url = URL.createObjectURL(file)
    img.onload = () => {
      URL.revokeObjectURL(url)
      const scale = Math.min(1, maxW / img.width)
      const canvas = document.createElement('canvas')
      canvas.width  = Math.round(img.width  * scale)
      canvas.height = Math.round(img.height * scale)
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height)
      canvas.toBlob(blob => {
        const reader = new FileReader()
        reader.onload = ev => resolve({
          data: ev.target.result.split(',')[1],
          type: 'image/jpeg',
        })
        reader.readAsDataURL(blob)
      }, 'image/jpeg', 0.82)
    }
    img.src = url
  })
}

const STICKERS = [
  '👻','💜','🌙','⭐','✨','💫','🔮','😈',
  '🥺','😏','😊','😢','😤','🫶','🤍','💀',

]

;(function initStickers() {

  ).join('')
})()

  document.getElementById('sticker-tray').classList.toggle('show')
}

function isSticker(text) {
  const trimmed = text.trim()
  const segmenter = typeof Intl !== 'undefined' && Intl.Segmenter
    ? new Intl.Segmenter().segment(trimmed)
    : null
  if (segmenter) {
    const segs = [...segmenter].filter(s => s.segment.trim())
    return segs.length <= 2 && /\p{Emoji}/u.test(trimmed)
  }
  return trimmed.length <= 4 && /\p{Emoji}/u.test(trimmed)
}

async function sendSticker(emoji) {
  document.getElementById('sticker-tray').classList.remove('show')
  if (busy) return
  busy = true
  statusEl.textContent = '正在回应…'

  addBubble('user', emoji, Date.now() / 1000, null)
  showTyping(true)

  try {
    const r = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: emoji }),
    })
    showTyping(false)
    const wrapEl = document.createElement('div')
    wrapEl.className = 'row ghost'
    wrapEl.innerHTML = '<div class="row-ava">👻</div>' +
      '<div class="col"><div class="bubble"></div><div class="ts">刚刚</div></div>'
    msgsEl.appendChild(wrapEl)
    const bubbleEl = wrapEl.querySelector('.bubble')
    let fullText = ''
    const reader = r.body.getReader()
    const decoder = new TextDecoder()
    let buf = ''
    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      buf += decoder.decode(value, { stream: true })
      const lines = buf.split('\n'); buf = lines.pop()
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue
        try {
          const ev = JSON.parse(line.slice(6))
          if (ev.t) {
            fullText += ev.t
            bubbleEl.textContent = fullText
            if (isSticker(fullText)) bubbleEl.classList.add('sticker-bubble')
            else bubbleEl.classList.remove('sticker-bubble')
            msgsEl.scrollTop = msgsEl.scrollHeight
          }
          if (ev.done && ev.id) {
            wrapEl.dataset.id = String(ev.id)
            if (ev.id > latestId) latestId = ev.id
          }
        } catch (_) {}
      }
    }
    statusEl.textContent = '在附近游荡…'
  } catch (_) {
    showTyping(false)
  }
  busy = false
}

async function loadLetters() {
  const r = await fetch('/letters')

  if (!d.letters.length) {
    list.innerHTML = '<div class="lt-empty">还没有信件，男鬼在酝酿中…</div>'

  if (d.letters[0].id > lastSeenLetterId) {
    lastSeenLetterId = d.letters[0].id
    localStorage.setItem('lastSeenLetter', lastSeenLetterId)
  }
  list.innerHTML = d.letters.map(l => {
    const date = new Date(l.ts * 1000).toLocaleDateString('zh-CN', {month:'long',day:'numeric'})
    const preview = l.content.slice(0, 60)
    return `<div class="lt-item" onclick="openLetter(${l.id}, '${date}', ${JSON.stringify(l.content)})">
      <div class="lt-item-date">${date}</div>
      <div class="lt-item-preview">${escape(preview)}…</div>
    </div>`
  }).join('')
}

async function openCd() {

async function loadCd() {
  const r = await fetch('/countdowns')
  const d = await r.json()
  const list = document.getElementById('cd-list')
  if (!d.countdowns.length) {
    list.innerHTML = '<div style="color:var(--dim);font-size:13px;text-align:center;padding:8px 0">还没有倒计时</div>'
    return
  }
  list.innerHTML = d.countdowns.map(c => {
    const label = c.days > 0 ? `还有 ${c.days} 天`
                : c.days === 0 ? '就是今天！'
                : `已过 ${-c.days} 天`
    const cls = c.days === 0 ? ' today' : ''
    return `<div class="cd-item">
      <div class="cd-item-info">
        <div class="cd-item-name">${c.name}</div>
        <div class="cd-item-days${cls}">${c.target_date} · ${label}</div>
      </div>
      <button class="cd-del" onclick="delCd(${c.id})">🗑</button>
    </div>`
  }).join('')
}

async function addCd() {
  const name = document.getElementById('cd-name').value.trim()
  const date = document.getElementById('cd-date').value
  if (!name || !date) return
  await fetch('/countdown', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, target_date: date }),
  })
  document.getElementById('cd-name').value = ''
  document.getElementById('cd-date').value = ''
  await loadCd()
}

async function delCd(id) {
  await fetch(`/countdown/${id}`, { method: 'DELETE' })
  await loadCd()
}

// ── voice input ───────────────────────────────────────────────────────────────
let recog = null
let micListening = false

;(function initMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition
  if (!SR) return
  const btn = document.getElementById('mic-btn')
  btn.style.display = ''

  recog = new SR()
  recog.lang = 'zh-CN'
  recog.continuous = false
  recog.interimResults = true

  recog.onresult = e => {
    const text = Array.from(e.results).map(r => r[0].transcript).join('')
    inp.value = text
    autoResize(inp)
  }

  recog.onend = () => {
    micListening = false
    btn.classList.remove('listening')
    btn.textContent = '🎤'
    statusEl.textContent = '在附近游荡…'
    if (inp.value.trim()) doSend()
  }

  recog.onerror = () => {
    micListening = false
    btn.classList.remove('listening')
    btn.textContent = '🎤'
    statusEl.textContent = '在附近游荡…'
  }
})()

function toggleMic() {
  if (!recog) { alert('当前浏览器不支持语音输入'); return }
  const btn = document.getElementById('mic-btn')
  if (micListening) {
    recog.stop()
  } else {
    inp.value = ''
    try { recog.start() } catch (_) { return }
    micListening = true
    btn.classList.add('listening')
    btn.textContent = '⏹'
    statusEl.textContent = '正在听…'
  }
}
