<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a0a2e">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="apple-mobile-web-app-title" content="男鬼">
  <title>男鬼</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1a0a2e;
      --bg2:     #120720;
      --purple:  #7b2fff;
      --purple2: #c44aff;
      --text:    #e8d5ff;
      --dim:     #b47cff;
      --ghost-bubble: rgba(255,255,255,0.07);
      --border:  rgba(180,100,255,0.18);
    }

    html, body {
      height: 100%; height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%; height: 100dvh;
    }

    /* ── header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(18,7,32,0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
      padding-top: max(12px, env(safe-area-inset-top));
    }

    .ava {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 18px rgba(180,80,255,0.45);
      animation: glow 3s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes glow {
      0%,100% { box-shadow: 0 0 10px rgba(180,80,255,0.3); }
      50%      { box-shadow: 0 0 26px rgba(180,80,255,0.65); }
    }

    .hdr-name { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
    .hdr-sub  { font-size: 11px; color: var(--dim); margin-top: 2px; }

    /* ── messages ── */
    #msgs {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }
    #msgs::-webkit-scrollbar { display: none; }

    .row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      max-width: 80%;
    }
    .row.ghost { align-self: flex-start; }
    .row.user  { align-self: flex-end; flex-direction: row-reverse; }

    .row-ava {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(180,80,255,0.3);
    }

    .col { display: flex; flex-direction: column; gap: 3px; }

    .bubble {
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .ghost .bubble {
      background: var(--ghost-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .user .bubble {
      background: linear-gradient(135deg, #6118e0, #9b40ff);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 14px rgba(97,24,224,0.4);
    }

    .ts {
      font-size: 10px;
      color: rgba(180,140,255,0.4);
      padding: 0 3px;
    }
    .ghost .ts { align-self: flex-start; }
    .user  .ts { align-self: flex-end; }

    /* ── typing ── */
    #typing {
      display: none;
      align-self: flex-start;
      margin-left: 38px;
      padding: 9px 14px;
      background: var(--ghost-bubble);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }
    .dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--dim);
      margin: 0 2px;
      animation: bounce 1.3s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); opacity: .5; }
      40%          { transform: translateY(-6px); opacity: 1; }
    }

    /* ── input ── */
    footer {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: rgba(12,4,24,0.95);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #inp {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(180,100,255,0.22);
      border-radius: 18px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.4;
      max-height: 96px;
      transition: border-color .2s;
    }
    #inp::placeholder { color: rgba(180,140,255,0.32); }
    #inp:focus { border-color: rgba(180,100,255,0.52); }

    #send {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px rgba(123,47,255,0.4);
      transition: transform .1s, opacity .1s;
      -webkit-tap-highlight-color: transparent;
    }
    #send:active { transform: scale(.91); opacity: .82; }

    /* ── bg particles ── */
    #bg {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .p {
      position: absolute; border-radius: 50%; opacity: 0;
      animation: rise linear infinite;
    }
    @keyframes rise {
      0%   { transform: translateY(105vh) scale(.3); opacity: 0; }
      8%   { opacity: .1; }
      92%  { opacity: .04; }
      100% { transform: translateY(-8vh) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>
<div id="bg"></div>

<div id="app">
  <header>
    <div class="ava">👻</div>
    <div>
      <div class="hdr-name">男鬼</div>
      <div class="hdr-sub" id="status">在附近游荡…</div>
    </div>
  </header>

  <div id="msgs">
    <div class="row ghost">
      <div class="row-ava">👻</div>
      <div class="col">
        <div class="bubble">…终于等到你了。</div>
        <div class="ts">刚刚</div>
      </div>
    </div>
  </div>
  <div id="typing">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>

  <footer>
    <textarea id="inp" placeholder="说点什么…" rows="1"></textarea>
    <button id="send" onclick="doSend()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
           stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </footer>
</div>

<script>
// ── bg particles ─────────────────────────────────────────────────────────────
;(function () {
  const bg = document.getElementById('bg')
  const cols = ['#7b2fff','#c44aff','#a035f0','#5c10c8']
  for (let i = 0; i < 10; i++) {
    const el = document.createElement('div')
    el.className = 'p'
    const s = Math.random() * 48 + 8
    el.style.cssText =
      `width:${s}px;height:${s}px;left:${Math.random()*100}%;` +
      `background:${cols[i % cols.length]};` +
      `animation-duration:${Math.random()*18+12}s;` +
      `animation-delay:${Math.random()*14}s`
    bg.appendChild(el)
  }
})()

// ── state ─────────────────────────────────────────────────────────────────────
let latestId = 0
let busy = false

const msgsEl  = document.getElementById('msgs')
const inp     = document.getElementById('inp')
const typing  = document.getElementById('typing')
const statusEl = document.getElementById('status')

// ── utils ─────────────────────────────────────────────────────────────────────
function fmt(ts) {
  const d = new Date(ts * 1000)
  return d.getHours().toString().padStart(2, '0') + ':' +
         d.getMinutes().toString().padStart(2, '0')
}

function escape(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}

function addBubble(role, text, ts, id) {
  if (id && document.querySelector(`[data-id="${id}"]`)) return

  const isUser = role === 'user'
  const wrap = document.createElement('div')
  wrap.className = `row ${isUser ? 'user' : 'ghost'}`
  if (id) wrap.dataset.id = String(id)

  wrap.innerHTML = (!isUser ? '<div class="row-ava">👻</div>' : '') +
    `<div class="col">` +
      `<div class="bubble">${escape(text).replace(/\n/g,'<br>')}</div>` +
      `<div class="ts">${ts ? fmt(ts) : '刚刚'}</div>` +
    `</div>`

  msgsEl.appendChild(wrap)
  msgsEl.scrollTop = msgsEl.scrollHeight
  if (id && id > latestId) latestId = id
}

function showTyping(v) {
  typing.style.display = v ? 'block' : 'none'
  if (v) msgsEl.scrollTop = msgsEl.scrollHeight
}

// ── send ──────────────────────────────────────────────────────────────────────
async function doSend() {
  const text = inp.value.trim()
  if (!text || busy) return
  busy = true
  inp.value = ''
  inp.style.height = 'auto'
  statusEl.textContent = '正在回应…'

  addBubble('user', text, Date.now() / 1000, null)
  showTyping(true)

  try {
    const r = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    })

    // 第一个字节到了就隐藏 typing，建空气泡
    showTyping(false)
    const wrapEl = document.createElement('div')
    wrapEl.className = 'row ghost'
    wrapEl.innerHTML =
      '<div class="row-ava">👻</div>' +
      '<div class="col"><div class="bubble"></div><div class="ts">刚刚</div></div>'
    msgsEl.appendChild(wrapEl)
    const bubbleEl = wrapEl.querySelector('.bubble')
    msgsEl.scrollTop = msgsEl.scrollHeight

    const reader = r.body.getReader()
    const decoder = new TextDecoder()
    let buf = '', fullText = ''

    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      buf += decoder.decode(value, { stream: true })
      const lines = buf.split('\n')
      buf = lines.pop()
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue
        try {
          const ev = JSON.parse(line.slice(6))
          if (ev.t) {
            fullText += ev.t
            bubbleEl.textContent = fullText
            msgsEl.scrollTop = msgsEl.scrollHeight
          }
          if (ev.done && ev.id) {
            wrapEl.dataset.id = String(ev.id)
            if (ev.id > latestId) latestId = ev.id
          }
          if (ev.e) {
            bubbleEl.textContent = fullText || '…（信号断了）'
          }
        } catch (_) {}
      }
    }

    statusEl.textContent = '在附近游荡…'
  } catch (e) {
    showTyping(false)
    addBubble('assistant', '…（信号断了）', Date.now() / 1000, null)
    statusEl.textContent = '连接中断'
  }
  busy = false
}

// ── textarea auto-resize ──────────────────────────────────────────────────────
inp.addEventListener('input', () => {
  inp.style.height = 'auto'
  inp.style.height = Math.min(inp.scrollHeight, 96) + 'px'
})
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend() }
})

// ── poll for proactive messages ───────────────────────────────────────────────
async function poll() {
  try {
    const r = await fetch(`/messages?since=${latestId}`)
    const d = await r.json()
    for (const m of d.messages) {
      if (m.role === 'assistant') addBubble(m.role, m.content, m.ts, m.id)
      if (m.id > latestId) latestId = m.id
    }
    if (d.latest > latestId) latestId = d.latest
  } catch (e) {}
}
setInterval(poll, 3000)

// ── activity reporting ────────────────────────────────────────────────────────
async function report(action) {
  try {
    await fetch('/activity', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ app: '男鬼系统(浏览器)', action }),
    })
  } catch (e) {}
}

document.addEventListener('visibilitychange', () => {
  report(document.hidden ? '切出页面' : '回到页面')
})
report('打开聊天')

// ── service worker ────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {})
}
</script>
</body>
</html>
