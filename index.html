<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a0a2e">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="apple-mobile-web-app-title" content="Claude">
  <title>Claude</title>
  <style>
    @font-face {
      font-family: 'GuDian';
      src: url('https://m.fonts.net.cn/AaGuDianKeBenSong-2.ttf') format('truetype');
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1a0a2e;
      --bg2:     #120720;
      --purple:  #7b2fff;
      --purple2: #c44aff;
      --text:    #e8d5ff;
      --dim:     #b47cff;
      --ghost-bubble: rgba(255,255,255,0.07);
      --border:  rgba(180,100,255,0.18);
      --modal-bg: rgba(10,3,20,0.92);
    }

    html, body {
      height: 100%; height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'GuDian', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%; height: 100dvh;
    }

    /* ── header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
      padding-top: max(12px, env(safe-area-inset-top));
    }

    .ava {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: #fff;
      box-shadow: 0 0 18px rgba(180,80,255,0.45);
      animation: glow 3s ease-in-out infinite;
      flex-shrink: 0;
      letter-spacing: 0;
    }
    @keyframes glow {
      0%,100% { box-shadow: 0 0 10px rgba(180,80,255,0.3); }
      50%      { box-shadow: 0 0 26px rgba(180,80,255,0.65); }
    }
    .ava img, .row-ava img, .drawer-avatar img {
      width: 100%; height: 100%;
      border-radius: 50%; object-fit: cover;
    }
    .ava-btn {
      display: block; margin: -4px auto 16px;
      background: none; border: 1px solid var(--border);
      color: var(--dim); font-size: 11px;
      padding: 3px 14px; border-radius: 20px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .ava-btn:active { opacity: .65; }

    .hdr-name { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
    .hdr-sub  { font-size: 11px; color: var(--dim); margin-top: 2px; }

    #streak-badge {
      display: none;
      margin-left: auto;
      margin-right: 6px;
      background: rgba(255,160,0,.15);
      border: 1px solid rgba(255,160,0,.3);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      color: #ffb020;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .rel-badge {
      display: inline-block;
      background: linear-gradient(90deg, var(--purple), var(--purple2));
      border-radius: 16px;
      padding: 5px 14px;
      font-size: 12px;
      color: #fff;
      margin: 0 16px 14px;
      text-align: center;
    }

    /* ── messages ── */
    #msgs {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }
    #msgs::-webkit-scrollbar { display: none; }

    .row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      max-width: 82%;
    }
    .row.ghost { align-self: flex-start; }
    .row.user  { align-self: flex-end; flex-direction: row-reverse; }

    .row-ava {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; color: #fff;
      flex-shrink: 0;
      letter-spacing: 0;
    }
    .row-ava img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .user-ava {
      background: linear-gradient(135deg, var(--purple2), var(--purple));
    }

    .col { display: flex; flex-direction: column; gap: 3px; }
    .row.user .col { align-items: flex-end; }

    .bubble {
      padding: 9px 13px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .ghost .bubble {
      background: var(--ghost-bubble);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 5px;
    }
    .user .bubble {
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .ts {
      font-size: 10px;
      color: var(--dim);
      opacity: 0.55;
      padding: 0 3px;
    }
    .ghost .ts { align-self: flex-start; }
    .user  .ts { align-self: flex-end; }

    /* ── typing ── */
    #typing {
      display: none;
      align-self: flex-start;
      margin-left: 38px;
      padding: 9px 14px;
      background: var(--ghost-bubble);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }
    .dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--dim);
      margin: 0 2px;
      animation: bounce 1.3s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); opacity: .5; }
      40%          { transform: translateY(-6px); opacity: 1; }
    }

    /* ── input ── */
    footer {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: var(--bg2);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #inp {
      flex: 1;
      background: var(--ghost-bubble);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.4;
      max-height: 96px;
      transition: border-color .2s;
    }
    #inp::placeholder { color: var(--dim); opacity: 0.45; }
    #inp:focus { border-color: var(--purple); }

    #send {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px rgba(123,47,255,0.4);
      transition: transform .1s, opacity .1s;
      -webkit-tap-highlight-color: transparent;
    }
    #send:active { transform: scale(.91); opacity: .82; }

    /* ── image ── */
    #img-preview-bar {
      display: none;
      padding: 8px 12px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #img-preview-bar.show { display: flex; }
    #img-thumb {
      width: 52px; height: 52px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    #img-clear {
      background: none; border: none;
      color: var(--dim); font-size: 20px; cursor: pointer;
      margin-left: auto;
    }
    #img-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      font-size: 17px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }
    #img-btn:active { background: rgba(123,47,255,.25); }

    /* user image bubble */
    .img-bubble {
      max-width: 180px;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: zoom-in;
      display: block;
    }

    #sticker-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }
    #sticker-btn:active { background: rgba(123,47,255,.25); }

    #mic-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, border-color .15s;
    }
    #mic-btn:active { background: rgba(123,47,255,.25); }
    #mic-btn.listening {
      background: rgba(210,40,40,.25);
      border-color: rgba(210,40,40,.5);
      animation: mic-pulse 1s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(210,40,40,.45); }
      50%      { box-shadow: 0 0 0 7px rgba(210,40,40,0); }
    }

    /* ── bubble long-press menu ── */
    #bubble-menu {
      position: fixed;
      display: none;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      z-index: 400;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
      min-width: 130px;
    }
    .bm-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 16px;
      font-size: 14px;
      color: var(--text);
      border-radius: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .bm-btn:active { background: rgba(255,255,255,.1); }
    #bm-mask {
      position: fixed; inset: 0; z-index: 399; display: none;
    }

    /* ── toast ── */
    #mem-toast {
      position: fixed;
      bottom: 90px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--purple);
      color: #fff;
      padding: 9px 20px;
      border-radius: 22px;
      font-size: 14px;
      opacity: 0; pointer-events: none;
      transition: opacity .22s, transform .22s;
      z-index: 500;
      white-space: nowrap;
    }
    #mem-toast.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    #sticker-tray {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 0; right: 0;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 10px 14px 12px;
    }
    #sticker-tray.show { display: block; }
    .sticker-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .sticker-title { font-size: 12px; font-weight: 600; color: var(--dim); }
    .sticker-hint { font-size: 10px; color: var(--dim); opacity: .55; }
    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
    }
    .sticker-item {
      font-size: 26px;
      text-align: center;
      cursor: pointer;
      padding: 4px 0;
      border-radius: 8px;
      transition: background .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .sticker-item:active { background: rgba(123,47,255,.3); }
    .sticker-divider { height: 1px; background: var(--border); margin: 8px 0; }
    .custom-sticker-grid {
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
    }
    .csticker-item {
      aspect-ratio: 1; border-radius: 8px; overflow: hidden;
      cursor: pointer; position: relative;
      -webkit-tap-highlight-color: transparent;
    }
    .csticker-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .csticker-item:active { opacity: .75; }
    .csticker-add {
      aspect-ratio: 1; border-radius: 8px;
      border: 1.5px dashed var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: var(--dim); cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .csticker-add:active { opacity: .65; }

    /* big sticker bubble */
    .bubble.sticker-bubble {
      background: transparent !important;
      border: none !important;
      font-size: 52px;
      padding: 2px 6px;
      line-height: 1.1;
    }

    /* ── drawer menu ── */
    #menu-btn {
      margin-left: auto;
      background: none; border: none;
      color: var(--dim); font-size: 22px;
      cursor: pointer; padding: 4px 6px;
      -webkit-tap-highlight-color: transparent;
      line-height: 1;
    }
    #menu-btn:active { color: var(--text); }

    #drawer-mask {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 150;
    }
    #drawer-mask.show { display: block; }

    #drawer {
      position: fixed; top: 0; right: -280px; bottom: 0;
      width: 260px;
      background: var(--bg2);
      border-left: 1px solid var(--border);
      z-index: 160;
      display: flex; flex-direction: column;
      padding-top: max(18px, env(safe-area-inset-top));
      transition: right .25s cubic-bezier(.4,0,.2,1);
      overflow-y: auto;
    }
    #drawer.open { right: 0; }

    .drawer-avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: #fff;
      margin: 0 auto 10px;
      box-shadow: 0 0 24px rgba(123,47,255,.4);
      letter-spacing: 0;
    }
    .drawer-name {
      text-align: center; font-size: 15px; font-weight: 600;
      margin-bottom: 4px;
    }
    .drawer-sub {
      text-align: center; font-size: 11px; color: var(--dim);
      margin-bottom: 20px;
    }

    .drawer-divider {
      height: 1px; background: var(--border);
      margin: 4px 16px 10px;
    }
    .drawer-section-title {
      font-size: 10px; color: rgba(180,140,255,.4);
      letter-spacing: .08em; text-transform: uppercase;
      padding: 0 20px; margin-bottom: 6px;
    }

    .drawer-item {
      display: flex; align-items: center;
      gap: 12px;
      padding: 12px 20px;
      cursor: pointer;
      transition: background .15s;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .drawer-item:active { background: rgba(123,47,255,.15); }
    .drawer-icon { display: none; }
    .drawer-label { font-size: 14px; }
    .drawer-badge {
      display: none;
      margin-left: auto;
      background: var(--purple2);
      color: #fff; font-size: 10px;
      border-radius: 10px; padding: 1px 6px;
    }
    .drawer-badge.show { display: block; }

    /* ── stats panel ── */
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; padding: 8px 16px 16px;
    }
    .stat-box {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
    }
    .stat-num { font-size: 22px; font-weight: 700; color: var(--purple2); }
    .stat-lbl { font-size: 10px; color: var(--dim); margin-top: 2px; }

    /* ── check-in ── */
    /* ci-btn moved to drawer */

    #ci-overlay {
      display: none;
      position: fixed; inset: 0;
      background: var(--modal-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #ci-overlay.show { display: flex; }

    .ci-card {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 20px 22px;
      width: min(310px, 90vw);
      text-align: center;
    }
    .ci-title { font-size: 15px; color: var(--dim); margin-bottom: 20px; }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .mood-btn {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 2px;
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      transition: background .15s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .mood-btn:active, .mood-btn.sel {
      background: rgba(123,47,255,.25);
      border-color: var(--purple);
    }
    .mood-btn .lb { font-size: 11px; color: var(--dim); }

    #ci-note {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      margin-bottom: 14px;
    }
    #ci-note::placeholder { color: rgba(180,140,255,.3); }

    #ci-submit {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    #ci-cancel {
      display: block; margin-top: 10px;
      background: none; border: none;
      color: var(--dim); font-size: 13px; cursor: pointer;
    }

    /* ── letters ── */
    /* lt-btn moved to drawer */

    #lt-overlay {
      display: none;
      position: fixed; inset: 0;
      background: var(--modal-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 200;
      align-items: flex-start;
      justify-content: center;
      padding-top: max(50px, env(safe-area-inset-top));
      overflow-y: auto;
    }
    #lt-overlay.show { display: flex; }

    .lt-card {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px 20px;
      width: min(380px, 92vw);
      margin-bottom: 40px;
    }
    .lt-head {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .lt-head-title { font-size: 15px; font-weight: 600; }
    .lt-close { background: none; border: none; color: var(--dim); font-size: 20px; cursor: pointer; }

    .lt-empty { color: var(--dim); font-size: 13px; text-align: center; padding: 20px 0; }

    .lt-item {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background .15s;
    }
    .lt-item:active { background: rgba(123,47,255,.15); }
    .lt-item-date { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
    .lt-item-preview {
      font-size: 14px; line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--text);
    }

    .lt-full {
      display: none;
      position: fixed; inset: 0;
      background: var(--modal-bg);
      z-index: 210;
      overflow-y: auto;
      padding: max(50px, env(safe-area-inset-top)) 20px 40px;
      align-items: flex-start;
      justify-content: center;
    }
    .lt-full.show { display: flex; }
    .lt-full-inner {
      width: min(400px, 92vw);
    }
    .lt-full-back {
      background: none; border: none;
      color: var(--dim); font-size: 13px;
      cursor: pointer; margin-bottom: 16px;
      padding: 0;
    }
    .lt-full-date { font-size: 11px; color: var(--dim); margin-bottom: 14px; }
    .lt-full-body {
      font-size: 15px; line-height: 1.9;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── countdown ── */
    /* cd-btn moved to drawer */

    #cd-overlay {
      display: none;
      position: fixed; inset: 0;
      background: var(--modal-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 200;
      align-items: flex-start;
      justify-content: center;
      padding-top: max(60px, env(safe-area-inset-top));
      overflow-y: auto;
    }
    #cd-overlay.show { display: flex; }

    .cd-card {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px 18px;
      width: min(340px, 92vw);
      margin-bottom: 40px;
    }
    .cd-head {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .cd-head-title { font-size: 15px; font-weight: 600; }

    /* ── memories overlay ── */
    #mem-overlay {

      background: rgba(255,255,255,.05);

    .mem-empty { color: var(--dim); font-size: 13px; text-align: center; padding: 20px 0; }
    .mem-item {
      display: flex; align-items: flex-start; gap: 10px;

    /* ── theme swatches ── */
    .theme-row {

    .swatch {

    .cp-hue-sl {
      background: linear-gradient(to right,
        oklch(65% .22 0),oklch(65% .22 60),oklch(65% .22 120),

    .cp-chr-sl { background: var(--border); }
    .cp-slider::-webkit-slider-thumb {

    }
    .cp-light-knob::after {

    }
    #cp-light:checked + .cp-light-knob { background: var(--purple); }
    #cp-light:checked + .cp-light-knob::after { left: 14px; background: #fff; }
    .cp-apply {
      flex: 1; min-width: 50px;

      color: var(--dim); font-size: 11px;

    .cp-apply:active { opacity: .65; }

    /* ── thinking block ── */
    .thinking-wrap {
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      max-width: 220px;
    }
    .thinking-toggle {

    }

    .thinking-body {

    /* ── voice bar ── */
    .voice-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 10px; border-radius: 16px; border-bottom-left-radius: 5px;
      background: rgba(110,40,230,0.18); border: 1.5px solid rgba(150,80,255,0.45);
      cursor: pointer; min-width: 100px; max-width: 170px;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .voice-play-btn {
      width: 26px; height: 26px; border-radius: 50%;
      border: none; background: var(--purple); color: #fff;
      font-size: 9px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 0; line-height: 1;
    }
    .voice-waves {
      flex: 1; display: flex; align-items: center; gap: 2px; height: 18px;
    }
    .voice-waves span {
      display: inline-block; width: 3px; border-radius: 2px;
      background: var(--dim); flex-shrink: 0;
    }
    .voice-waves span:nth-child(1) { height: 7px; }
    .voice-waves span:nth-child(2) { height: 13px; }
    .voice-waves span:nth-child(3) { height: 9px; }
    .voice-waves span:nth-child(4) { height: 5px; }
    .voice-waves span:nth-child(5) { height: 11px; }
    .voice-bar.playing .voice-waves span {
      background: var(--purple2);
      animation: vwave .7s ease-in-out infinite alternate;
    }
    .voice-waves span:nth-child(2) { animation-delay: .12s; }
    .voice-waves span:nth-child(3) { animation-delay: .24s; }
    .voice-waves span:nth-child(4) { animation-delay: .1s; }
    .voice-waves span:nth-child(5) { animation-delay: .18s; }
    @keyframes vwave {
      from { transform: scaleY(.4); }
      to   { transform: scaleY(1.4); }
    }
    .voice-dur { font-size: 11px; color: var(--dim); flex-shrink: 0; }

    /* ── traces overlay ── */
    #trace-overlay {
      display: none; position: fixed; inset: 0;
      background: var(--modal-bg);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      z-index: 200; align-items: flex-start; justify-content: center;
      padding-top: max(50px, env(safe-area-inset-top)); overflow-y: auto;

    #trace-overlay.show { display: flex; }

    .trace-head {

    .trace-head-title { font-size: 15px; font-weight: 600; }
    .trace-close { background: none; border: none; color: var(--dim); font-size: 20px; cursor: pointer; }
    .trace-empty { color: var(--dim); font-size: 13px; text-align: center; padding: 20px 0; }
    .trace-item {

    .trace-desc { font-size: 14px; line-height: 1.5; color: var(--text); }

    /* ── books overlay ── */
    #books-overlay {
      display: none; position: fixed; inset: 0;
      background: var(--modal-bg);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);

      padding-top: max(50px, env(safe-area-inset-top)); overflow-y: auto;

    .books-head {

    .books-close { background: none; border: none; color: var(--dim); font-size: 20px; cursor: pointer; }
    .book-item {
      background: rgba(255,255,255,.04); border: 1px solid var(--border);

    .book-author { font-size: 11px; color: var(--dim); }

    .book-meta { font-size: 11px; color: var(--dim); }
    .book-notes-preview {

    .books-add-btn {
      width: 100%; padding: 11px; border: 1.5px dashed var(--border);

    /* book edit panel */

      background: rgba(255,255,255,.05); border: 1px solid var(--border);
      border-radius: 22px; padding: 24px 20px;
      width: min(380px, 92vw); margin-bottom: 40px;

      display: flex; align-items: center; justify-content: space-between;

    /* ── bg particles ── */
    #bg {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .p {
      position: absolute; border-radius: 50%; opacity: 0;
      animation: rise linear infinite;
    }
    @keyframes rise {
      0%   { transform: translateY(105vh) scale(.3); opacity: 0; }

<script>
// ── bg particles ─────────────────────────────────────────────────────────────
;(function () {
  const bg = document.getElementById('bg')
  const cols = ['#7b2fff','#c44aff','#a035f0','#5c10c8']
  for (let i = 0; i < 10; i++) {
    const el = document.createElement('div')
    el.className = 'p'
    const s = Math.random() * 48 + 8
    el.style.cssText =
      `width:${s}px;height:${s}px;left:${Math.random()*100}%;` +
      `background:${cols[i % cols.length]};` +
      `animation-duration:${Math.random()*18+12}s;` +
      `animation-delay:${Math.random()*14}s`
    bg.appendChild(el)
  }
})()

// ── state ─────────────────────────────────────────────────────────────────────
let latestId = 0
let busy = false

const msgsEl  = document.getElementById('msgs')
const inp     = document.getElementById('inp')
const typing  = document.getElementById('typing')
const statusEl = document.getElementById('status')

// ── utils ─────────────────────────────────────────────────────────────────────
function fmt(ts) {
  const d = new Date(ts * 1000)
  return d.getHours().toString().padStart(2, '0') + ':' +
         d.getMinutes().toString().padStart(2, '0')
}

function escape(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}

function addBubble(role, text, ts, id) {
  if (id && document.querySelector(`[data-id="${id}"]`)) return

  const isUser = role === 'user'
  const wrap = document.createElement('div')
  wrap.className = `row ${isUser ? 'user' : 'ghost'}`
  if (id) wrap.dataset.id = String(id)

  const stickerClass = isSticker(text) ? ' sticker-bubble' : ''
  wrap.innerHTML = (isUser ? userAvaHtml() : rowAvaHtml()) +
    `<div class="col">` +
      `<div class="bubble${stickerClass}">${escape(text).replace(/\n{2,}/g,'\n').replace(/\n/g,'<br>')}</div>` +
      `<div class="ts">${ts ? fmt(ts) : '刚刚'}</div>` +
    `</div>`

  // attach long-press to bubble
  const bubbleEl = wrap.querySelector('.bubble')
  if (bubbleEl) attachLongPress(bubbleEl, text)

  msgsEl.appendChild(wrap)
  msgsEl.scrollTop = msgsEl.scrollHeight
  if (id && id > latestId) latestId = id
}

function showTyping(v) {
  typing.style.display = v ? 'block' : 'none'
  if (v) msgsEl.scrollTop = msgsEl.scrollHeight
}

// ── send ──────────────────────────────────────────────────────────────────────
async function doSend() {
  const text = inp.value.trim()
  const img  = pendingImg
  if (!text && !img || busy) return
  busy = true
  inp.value = ''
  inp.style.height = 'auto'
  statusEl.textContent = '正在回应…'
  clearImg()

  // Show user bubble (image thumbnail if present)
  if (img) {
    const wrapU = document.createElement('div')
    wrapU.className = 'row user'
    wrapU.innerHTML =
      userAvaHtml() +
      `<div class="col">` +
        `<img class="img-bubble" src="data:${img.type};base64,${img.data}" onclick="openLightbox(this.src)">` +
        (text ? `<div class="bubble" style="margin-top:4px">${escape(text)}</div>` : '') +
        `<div class="ts">刚刚</div>` +
      `</div>`
    msgsEl.appendChild(wrapU)
    msgsEl.scrollTop = msgsEl.scrollHeight
  } else {
    addBubble('user', text, Date.now() / 1000, null)
  }
  showTyping(true)

  const body = { message: text }
  if (img) body.image = img

  try {
    const r = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })

    // 第一个字节到了就隐藏 typing，建空气泡
    showTyping(false)
    const wrapEl = document.createElement('div')
    wrapEl.className = 'row ghost'
    wrapEl.innerHTML =
      rowAvaHtml() +
      '<div class="col"><div class="bubble"></div><div class="ts">刚刚</div></div>'
    msgsEl.appendChild(wrapEl)
    const bubbleEl = wrapEl.querySelector('.bubble')
    const colEl = wrapEl.querySelector('.col')
    msgsEl.scrollTop = msgsEl.scrollHeight

    const thinkWrap = document.createElement('div')
    thinkWrap.className = 'thinking-wrap'
    thinkWrap.innerHTML = '<div class="thinking-toggle">…在想</div><div class="thinking-body"></div>'
    thinkWrap.onclick = () => thinkWrap.classList.toggle('open')

    const reader = r.body.getReader()
    const decoder = new TextDecoder()
    let buf = '', fullText = '', thinkText = ''

    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      buf += decoder.decode(value, { stream: true })
      const lines = buf.split('\n')
      buf = lines.pop()
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue
        try {
          const ev = JSON.parse(line.slice(6))
          if (ev.th) {
            thinkText += ev.th
            if (!thinkWrap.parentElement) colEl.insertBefore(thinkWrap, bubbleEl)
            thinkWrap.querySelector('.thinking-body').textContent = thinkText
          }
          if (ev.t) {
            fullText += ev.t
            bubbleEl.textContent = fullText.replace(/\n{2,}/g, '\n')
            msgsEl.scrollTop = msgsEl.scrollHeight
          }
          if (ev.done && ev.id) {
            wrapEl.dataset.id = String(ev.id)
            if (ev.id > latestId) latestId = ev.id
          }
          if (ev.e) {
            bubbleEl.textContent = fullText.replace(/\n{2,}/g, '\n') || '…（信号断了）'
          }
        } catch (_) {}
      }
    }

    if (fullText) {
      fullText = fullText.replace(/\n{2,}/g, '\n')
      attachLongPress(bubbleEl, fullText.trim())
      addTtsBar(fullText.trim(), wrapEl)
    }
    statusEl.textContent = '在附近游荡…'
  } catch (e) {
    showTyping(false)
    addBubble('assistant', '…（信号断了）', Date.now() / 1000, null)
    statusEl.textContent = '连接中断'
  }
  busy = false
}

// ── textarea auto-resize ──────────────────────────────────────────────────────
function autoResize(el) {
  el.style.height = 'auto'
  el.style.height = Math.min(el.scrollHeight, 96) + 'px'
}
inp.addEventListener('input', () => autoResize(inp))
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend() }
})

// ── poll for proactive messages ───────────────────────────────────────────────
async function poll() {
  try {
    const r = await fetch(`/messages?since=${latestId}`)
    const d = await r.json()
    for (const m of d.messages) {
      if (m.role === 'assistant') addBubble(m.role, m.content, m.ts, m.id)
      if (m.id > latestId) latestId = m.id
    }
    if (d.latest > latestId) latestId = d.latest
  } catch (e) {}
}
setInterval(poll, 3000)

// ── activity reporting ────────────────────────────────────────────────────────
async function report(action) {
  try {
    await fetch('/activity', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ app: 'Claude(浏览器)', action }),
    })
  } catch (e) {}
}

document.addEventListener('visibilitychange', () => {
  report(document.hidden ? '切出页面' : '回到页面')
})
report('打开聊天')

// ── web push ──────────────────────────────────────────────────────────────────
async function initNotif() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) return
  const badge = document.getElementById('notif-badge')
  if (Notification.permission === 'granted') {
    const reg = await navigator.serviceWorker.ready
    const sub = await reg.pushManager.getSubscription()
    if (sub) { badge.textContent = '已开启'; badge.style.background = '#2d9e5f'; return }
  }
  if (Notification.permission === 'denied') { badge.textContent = '已拒绝'; return }
}

async function toggleNotif() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) {
    alert('当前浏览器不支持推送通知'); return
  }
  const badge = document.getElementById('notif-badge')
  const reg = await navigator.serviceWorker.ready
  const existing = await reg.pushManager.getSubscription()

  if (existing) {
    // 已订阅 → 取消
    await fetch('/push/unsubscribe', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ endpoint: existing.endpoint }),
    })
    await existing.unsubscribe()
    badge.textContent = '未开启'; badge.style.background = ''
    return
  }

  // 申请权限
  const perm = await Notification.requestPermission()
  if (perm !== 'granted') { badge.textContent = '已拒绝'; return }

  // 获取 VAPID 公钥
  const kRes = await fetch('/push/vapid-public-key')
  const { publicKey } = await kRes.json()

  // 订阅
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: _urlB64ToUint8(publicKey),
  })
  await fetch('/push/subscribe', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(sub.toJSON()),
  })
  badge.textContent = '已开启'; badge.style.background = '#2d9e5f'
}

function _urlB64ToUint8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4)
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'))
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)))
}

// ── rain sound ────────────────────────────────────────────────────────────────
let rainCtx = null, rainSrc = null, rainGain = null, rainOn = false

function toggleRain() {
  navigator.vibrate && navigator.vibrate(20)
  if (!rainCtx) {
    try { rainCtx = new (window.AudioContext || window.webkitAudioContext)() }
    catch (_) { showMemToast('当前浏览器不支持音频'); return }
  }
  const badge = document.getElementById('rain-badge')
  if (rainOn) {
    rainGain.gain.setTargetAtTime(0, rainCtx.currentTime, 0.4)
    setTimeout(() => { try { rainSrc.stop() } catch (_) {} rainSrc = null }, 800)
    rainOn = false
    badge.classList.remove('show')
    return
  }
  const rate = rainCtx.sampleRate
  const buf = rainCtx.createBuffer(2, rate * 3, rate)
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch)
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0
    for (let i = 0; i < d.length; i++) {
      const w = (Math.random()*2-1)
      b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759
      b2=.96900*b2+w*.1538520; b3=.86650*b3+w*.3104856
      b4=.55000*b4+w*.5329522; b5=-.7616*b5-w*.0168980
      d[i] = (b0+b1+b2+b3+b4+b5+b6+w*.5362)*0.11
      b6 = w*0.115926
    }
  }
  rainSrc = rainCtx.createBufferSource()
  rainSrc.buffer = buf; rainSrc.loop = true
  rainGain = rainCtx.createGain(); rainGain.gain.value = 0
  rainSrc.connect(rainGain); rainGain.connect(rainCtx.destination)
  rainSrc.start()
  rainGain.gain.setTargetAtTime(0.35, rainCtx.currentTime, 0.5)
  rainOn = true
  badge.classList.add('show')
}

function handleAvaFile(input) {
  const file = input.files[0]; if (!file) return
  const reader = new FileReader()
  reader.onload = e => {
    const img = new Image()
    img.onload = () => {
      const canvas = document.createElement('canvas')
      canvas.width = canvas.height = 200
      const ctx = canvas.getContext('2d')
      const min = Math.min(img.width, img.height)
      ctx.drawImage(img, (img.width - min) / 2, (img.height - min) / 2, min, min, 0, 0, 200, 200)
      localStorage.setItem('ghost-avatar', canvas.toDataURL('image/jpeg', 0.85))
      loadAvatar()
      navigator.vibrate && navigator.vibrate(20)
    }
    img.src = e.target.result
  }
  reader.readAsDataURL(file)
  input.value = ''
}

function applyTheme(name) {
  if (name === '自定义') {
    const cp = JSON.parse(localStorage.getItem('custom-colors') || '{}')
    if (cp.accent) { localStorage.removeItem('custom-colors'); applyTheme('幽灵'); return }
    applyCssVars(generateOklchTheme(cp.h ?? 270, cp.c ?? 22, !!cp.light, cp.textColor || null))
    localStorage.setItem('theme', '自定义')
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'))
    return
  }
  const t = THEMES[name] || THEMES['深色']; if (!t) return
  const r = document.documentElement
  for (const [k, v] of Object.entries(t)) {
    if (k.startsWith('--')) r.style.setProperty(k, v)
  }
  const tc = document.querySelector('meta[name="theme-color"]')
  if (tc) tc.content = t['--bg']
  localStorage.setItem('theme', name)
  document.querySelectorAll('.swatch').forEach(s =>
    s.classList.toggle('active', s.dataset.name === name))
}

function buildThemeRow() {
  const row = document.getElementById('theme-row')
  const saved = localStorage.getItem('theme') || '深色'
  row.innerHTML = ''
  for (const [name, t] of Object.entries(THEMES)) {
    const b = document.createElement('div')
    b.className = 'swatch' + (name === saved ? ' active' : '')
    b.dataset.name = name
    b.title = name
    b.style.background = t.swatch
    b.onclick = () => applyTheme(name)
    row.appendChild(b)
  }
  loadCustomColorPickers()
}

// ── ColorSpace oklch custom theme ─────────────────────────────────────────────
function generateOklchTheme(h, c, isLight, textOverride) {
  const C = c / 100
  if (isLight) {
    return {
      '--bg':           `oklch(95% ${(C*0.10).toFixed(3)} ${h})`,
      '--bg2':          `oklch(91% ${(C*0.12).toFixed(3)} ${h})`,
      '--purple':       `oklch(48% ${C.toFixed(3)} ${h})`,
      '--purple2':      `oklch(57% ${(C*1.1).toFixed(3)} ${(h+20)%360})`,
      '--text':          textOverride || `oklch(14% ${(C*0.08).toFixed(3)} ${h})`,
      '--dim':          `oklch(40% ${(C*0.7).toFixed(3)} ${h})`,
      '--ghost-bubble': 'oklch(0% 0 0 / 6%)',
      '--border':       `oklch(48% ${(C*0.5).toFixed(3)} ${h} / 20%)`,
      '--modal-bg':     'rgba(248,246,255,0.95)',
    }
  }
  return {
    '--bg':           `oklch(10% ${(C*0.08).toFixed(3)} ${h})`,
    '--bg2':          `oklch(7% ${(C*0.07).toFixed(3)} ${h})`,
    '--purple':       `oklch(60% ${C.toFixed(3)} ${h})`,
    '--purple2':      `oklch(70% ${(C*1.1).toFixed(3)} ${(h+20)%360})`,
    '--text':          textOverride || `oklch(88% ${(C*0.18).toFixed(3)} ${h})`,
    '--dim':          `oklch(65% ${(C*0.6).toFixed(3)} ${h})`,
    '--ghost-bubble': 'oklch(100% 0 0 / 7%)',
    '--border':       `oklch(55% ${(C*0.5).toFixed(3)} ${h} / 22%)`,
    '--modal-bg':     'rgba(8,3,18,0.93)',
  }
}

const MOOD_META = {
  '很好':  { em: '😊', color: '#3dba5e' },
  '还行':  { em: '😐', color: '#c8b820' },
  '有点累':{ em: '😮‍💨', color: '#e07830' },

  '烦躁':  { em: '😤', color: '#dd4444' },

const REL_LEVELS = [
  [0,   '初次相遇'],
  [3,   '渐渐熟悉'],
  [7,   '成为朋友'],
  [14,  '无话不谈'],
  [30,  '灵魂共鸣'],
  [60,  '永恒伴侣'],
]

function relLevel(days) {
  let label = REL_LEVELS[0][1]
  for (const [d, l] of REL_LEVELS) {
    if (days >= d) label = l
  }
  return label
}

async function loadStats() {
  try {
    const [sr, cr, strr] = await Promise.all([
      fetch('/stats'), fetch('/checkins?limit=30'), fetch('/streak')
    ])
    const d  = await sr.json()
    const cd = await cr.json()
    const sd = await strr.json()

    document.getElementById('s-msgs').textContent   = d.messages
    document.getElementById('s-days').textContent   = d.days
    document.getElementById('s-checks').textContent = d.checkins
    document.getElementById('s-letts').textContent  = d.letters

    // streak badge in header
    const sb = document.getElementById('streak-badge')
    if (sd.streak >= 2) {
      sb.textContent = `${sd.streak}天连击`
      sb.style.display = ''
    } else {
      sb.style.display = 'none'
    }

    // relationship level in drawer
    const rb = document.getElementById('rel-badge')
    rb.textContent = `${relLevel(sd.total)}  ·  已相识 ${sd.total} 天`
    rb.style.display = ''

    renderMoodChart(cd.checkins)
  } catch (_) {}
}

function renderMoodChart(checkins) {
  const chart = document.getElementById('mood-chart')
  // build map: CST date string → mood
  const byDate = {}
  for (const c of checkins) {
    const cst = new Date((c.ts + 8 * 3600) * 1000)
    const key = `${cst.getUTCFullYear()}-${cst.getUTCMonth()}-${cst.getUTCDate()}`
    if (!byDate[key]) byDate[key] = c  // most recent per day
  }

  const days = ['日','一','二','三','四','五','六']
  const cols = []
  for (let i = 6; i >= 0; i--) {
    const d = new Date(Date.now() + 8 * 3600000 - i * 86400000)
    const key = `${d.getUTCFullYear()}-${d.getUTCMonth()}-${d.getUTCDate()}`
    const entry = byDate[key]
    const meta = entry ? MOOD_META[entry.mood] : null
    const dotStyle = meta
      ? `background:${meta.color};` : ''
    const title = entry ? `${entry.mood}${entry.note ? ' · ' + entry.note : ''}` : '未打卡'
    cols.push(
      `<div class="mood-day" title="${escape(title)}">` +
        `<div class="mood-dot${meta ? ' filled' : ''}" style="${dotStyle}">` +
          (meta ? meta.em : '') +
        `</div>` +
        `<div class="mood-day-lbl">${days[d.getUTCDay()]}</div>` +
      `</div>`
    )
  }
  chart.innerHTML = cols.join('')
}

  const file = e.target.files[0]
  if (!file) return
  pendingImg = await resizeImage(file)
  document.getElementById('img-thumb').src =
    `data:${pendingImg.type};base64,${pendingImg.data}`
  document.getElementById('img-preview-bar').classList.add('show')
  // close sticker tray if open
  document.getElementById('sticker-tray').classList.remove('show')
}

function resizeImage(file, maxW = 800) {
  return new Promise(resolve => {
    const img = new Image()
    const url = URL.createObjectURL(file)
    img.onload = () => {
      URL.revokeObjectURL(url)
      const scale = Math.min(1, maxW / img.width)
      const canvas = document.createElement('canvas')
      canvas.width  = Math.round(img.width  * scale)
      canvas.height = Math.round(img.height * scale)
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height)
      canvas.toBlob(blob => {
        const reader = new FileReader()
        reader.onload = ev => resolve({
          data: ev.target.result.split(',')[1],
          type: 'image/jpeg',
        })
        reader.readAsDataURL(blob)
      }, 'image/jpeg', 0.82)
    }
    img.src = url
  })
}

function addCustomSticker(input) {
  const file = input.files[0]; if (!file) return
  const reader = new FileReader()
  reader.onload = e => {
    const img = new Image()
    img.onload = () => {
      const canvas = document.createElement('canvas')
      canvas.width = canvas.height = 300
      const ctx = canvas.getContext('2d')
      const min = Math.min(img.width, img.height)
      ctx.drawImage(img, (img.width - min) / 2, (img.height - min) / 2, min, min, 0, 0, 300, 300)
      const stored = JSON.parse(localStorage.getItem('custom-stickers') || '[]')
      stored.push(canvas.toDataURL('image/jpeg', 0.82))
      localStorage.setItem('custom-stickers', JSON.stringify(stored))
      renderCustomStickers()
      navigator.vibrate && navigator.vibrate(20)
    }
    img.src = e.target.result
  }
  reader.readAsDataURL(file)
  input.value = ''
}

function deleteCustomSticker(i) {
  const stored = JSON.parse(localStorage.getItem('custom-stickers') || '[]')
  stored.splice(i, 1)
  localStorage.setItem('custom-stickers', JSON.stringify(stored))
  renderCustomStickers()
  navigator.vibrate && navigator.vibrate([30, 20, 30])
}

async function sendImageSticker(src) {

    })

    while (true) {

      if (done) break
      buf += decoder.decode(value, { stream: true })
      const lines = buf.split('\n'); buf = lines.pop()
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue
        try {

function isSticker(text) {
  const trimmed = text.trim()
  const segmenter = typeof Intl !== 'undefined' && Intl.Segmenter
    ? new Intl.Segmenter().segment(trimmed)
    : null
  if (segmenter) {
    const segs = [...segmenter].filter(s => s.segment.trim())
    return segs.length <= 2 && /\p{Emoji}/u.test(trimmed)
  }
  return trimmed.length <= 4 && /\p{Emoji}/u.test(trimmed)
}

function applyChatBg(value) {
  const msgs = document.getElementById('msgs')
  if (!value) {
    msgs.style.backgroundImage = ''
    msgs.style.backgroundColor = ''
    localStorage.removeItem('chat-bg')
  } else if (value.startsWith('#') || value.startsWith('rgb')) {
    msgs.style.backgroundColor = value
    msgs.style.backgroundImage = ''
    localStorage.setItem('chat-bg', value)
  } else if (value.startsWith('data:')) {
    msgs.style.backgroundImage = `url("${value}")`
    msgs.style.backgroundSize = 'cover'
    msgs.style.backgroundPosition = 'center'
    msgs.style.backgroundColor = ''
    localStorage.setItem('chat-bg', value)
  }
  document.querySelectorAll('.bg-swatch-wrap').forEach(w =>
    w.classList.toggle('active', w.dataset.value === (value || '')))
}

function loadChatBg() {
  const saved = localStorage.getItem('chat-bg')
  if (saved) applyChatBg(saved)
}

function buildBgSwatches() {
  const container = document.getElementById('bg-swatches')
  if (!container) return
  const current = localStorage.getItem('chat-bg') || ''
  container.innerHTML = ''
  BG_PRESETS.forEach(p => {
    const wrap = document.createElement('div')
    wrap.className = 'bg-swatch-wrap' + (current === (p.value || '') ? ' active' : '')
    wrap.dataset.value = p.value || ''
    const sw = document.createElement('div')
    sw.className = 'bg-swatch'
    if (p.value) {
      sw.style.background = p.value
    } else {
      sw.style.background = 'linear-gradient(135deg, var(--bg), var(--bg2))'
      sw.style.borderStyle = 'dashed'
      sw.style.borderColor = 'var(--dim)'
    }
    const lbl = document.createElement('div')
    lbl.className = 'bg-swatch-lbl'
    lbl.textContent = p.label
    wrap.appendChild(sw)
    wrap.appendChild(lbl)
    wrap.onclick = () => applyChatBg(p.value)
    container.appendChild(wrap)
  })
  // Show image preview if bg is an image
  const saved = localStorage.getItem('chat-bg') || ''
  const preview = document.getElementById('bg-img-preview')
  const thumb = document.getElementById('bg-img-thumb')
  if (saved.startsWith('data:') && preview && thumb) {
    thumb.src = saved
    preview.style.display = ''
  } else if (preview) {
    preview.style.display = 'none'
  }
}

function handleBgFile(input) {
  const file = input.files[0]
  if (!file) return
  const reader = new FileReader()
  reader.onload = e => {
    const img = new Image()
    img.onload = () => {
      const canvas = document.createElement('canvas')
      const MAX = 1080
      let w = img.width, h = img.height
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX }
      canvas.width = w; canvas.height = h
      canvas.getContext('2d').drawImage(img, 0, 0, w, h)
      const data = canvas.toDataURL('image/jpeg', 0.72)
      applyChatBg(data)
      const preview = document.getElementById('bg-img-preview')
      const thumb = document.getElementById('bg-img-thumb')
      if (preview && thumb) { thumb.src = data; preview.style.display = '' }
      input.value = ''
    }
    img.src = e.target.result
  }
  reader.readAsDataURL(file)
}

      body: JSON.stringify({ mood: ciMood, note }),
    })
    const d = await r.json()
    showTyping(false)
    if (d.reply) addBubble('assistant', d.reply, Date.now() / 1000, d.id)
  } catch (_) {
    showTyping(false)
  }
}

// ── voice input (hold-to-record → ElevenLabs STT) ────────────────────────────
let mediaRec = null
let audioChunks = []
let micStream = null
let isRecording = false

;(function initMic() {
  if (!navigator.mediaDevices || !window.MediaRecorder) return
  const btn = document.getElementById('mic-btn')
  btn.style.display = ''

  // Pick the best format ElevenLabs supports
  const MIME_PREF = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/ogg']
  const recMime = MIME_PREF.find(m => MediaRecorder.isTypeSupported(m)) || ''
  const recExt  = recMime.includes('mp4') ? 'mp4' : recMime.includes('ogg') ? 'ogg' : 'webm'

  const startRec = async () => {
    if (busy || isRecording) return
    // Check permission state before prompting
    if (navigator.permissions) {
      try {
        const perm = await navigator.permissions.query({ name: 'microphone' })
        if (perm.state === 'denied') {
          showMemToast('麦克风权限已被禁止，请在系统设置中开启')
          return
        }
        if (perm.state === 'prompt') showMemToast('请允许麦克风权限')
      } catch (_) {}
    }
    navigator.vibrate && navigator.vibrate(40)
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true })
    } catch (e) {
      const msg = (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError')
        ? '麦克风权限被拒绝，请在设置中开启'
        : '无法访问麦克风'
      showMemToast(msg)
      return
    }
    audioChunks = []
    const opts = recMime ? { mimeType: recMime } : {}
    mediaRec = new MediaRecorder(micStream, opts)
    mediaRec.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data) }
    mediaRec.start()
    isRecording = true
    btn.classList.add('listening')
    btn.textContent = '松开'
    statusEl.textContent = '录音中…'
  }

  const stopRec = async () => {
    if (!isRecording || !mediaRec) return
    isRecording = false
    btn.classList.remove('listening')
    btn.textContent = '录'
    statusEl.textContent = '处理中…'
    await new Promise(res => { mediaRec.onstop = res; mediaRec.stop() })
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null }
    const mimeUsed = mediaRec.mimeType || recMime || 'audio/webm'
    const ext = mimeUsed.includes('mp4') ? 'mp4' : mimeUsed.includes('ogg') ? 'ogg' : 'webm'
    const blob = new Blob(audioChunks, { type: mimeUsed })
    if (blob.size < 1500) { statusEl.textContent = '在附近游荡…'; return }
    await sendVoiceMessage(blob, ext)
  }

  btn.addEventListener('touchstart', e => { e.preventDefault(); startRec() }, { passive: false })
  btn.addEventListener('touchend',   e => { e.preventDefault(); stopRec()  }, { passive: false })
  btn.addEventListener('touchcancel',e => { e.preventDefault(); stopRec()  }, { passive: false })
  btn.addEventListener('mousedown', startRec)
  btn.addEventListener('mouseup',   stopRec)
  btn.addEventListener('mouseleave', () => { if (isRecording) stopRec() })
})()

async function sendVoiceMessage(blob, ext = 'webm') {
  busy = true
  statusEl.textContent = '识别中…'
  console.log('[STT] 发送音频，大小:', blob.size, '格式:', ext, 'type:', blob.type)
  const form = new FormData()
  form.append('audio', blob, `rec.${ext}`)
  try {
    const r = await fetch('/api/stt', { method: 'POST', body: form })
    console.log('[STT] 响应 status:', r.status)
    if (!r.ok) {
      const errText = await r.text().catch(() => '')
      console.error('[STT] 接口失败:', r.status, errText)
      throw new Error('stt ' + r.status)
    }
    showTyping(false)
    let userShown = false
    const wrapEl = document.createElement('div')
    wrapEl.className = 'row ghost'
    wrapEl.innerHTML = rowAvaHtml() +
      '<div class="col"><div class="bubble"></div><div class="ts">刚刚</div></div>'
    const bubbleEl = wrapEl.querySelector('.bubble')
    const colEl = wrapEl.querySelector('.col')
    const thinkWrap = document.createElement('div')
    thinkWrap.className = 'thinking-wrap'
    thinkWrap.innerHTML = '<div class="thinking-toggle">…在想</div><div class="thinking-body"></div>'
    thinkWrap.onclick = () => thinkWrap.classList.toggle('open')
    const reader = r.body.getReader()
    const decoder = new TextDecoder()
    let buf = '', fullText = '', thinkText = ''
    while (true) {
      const { done, value } = await reader.read()
      if (done) break
      buf += decoder.decode(value, { stream: true })
      const lines = buf.split('\n'); buf = lines.pop()
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue
        try {
          const ev = JSON.parse(line.slice(6))
          if (ev.transcript && !userShown) {
            console.log('[STT] 识别文字:', ev.transcript)
            addBubble('user', ev.transcript, Date.now() / 1000, null)
            userShown = true
            statusEl.textContent = '正在回应…'
            msgsEl.appendChild(wrapEl)
            msgsEl.scrollTop = msgsEl.scrollHeight
          }
          if (ev.th) {
            thinkText += ev.th
            if (!thinkWrap.parentElement && userShown) colEl.insertBefore(thinkWrap, bubbleEl)
            thinkWrap.querySelector('.thinking-body').textContent = thinkText
          }
          if (ev.t) {
            fullText += ev.t
            bubbleEl.textContent = fullText.replace(/\n{2,}/g, '\n')
            msgsEl.scrollTop = msgsEl.scrollHeight
          }
          if (ev.done && ev.id) {
            wrapEl.dataset.id = String(ev.id)
            if (ev.id > latestId) latestId = ev.id
          }
        } catch (_) {}
      }
    }
    if (fullText) {
      fullText = fullText.replace(/\n{2,}/g, '\n')
      attachLongPress(bubbleEl, fullText.trim())
      addTtsBar(fullText.trim(), wrapEl)
    }
    statusEl.textContent = '在附近游荡…'
  } catch (e) {
    console.error('[STT] 出错:', e)
    showMemToast('语音识别失败，请重试')
    statusEl.textContent = '在附近游荡…'
  }
  busy = false
}

// ── TTS voice bar ─────────────────────────────────────────────────────────────
let _ttsAudio = null
let _ttsBar   = null

function playVoiceBar(barEl) {
  const playBtn = barEl.querySelector('.voice-play-btn')
  // Toggle same bar
  if (_ttsAudio && _ttsBar === barEl) {
    if (_ttsAudio.paused) {
      _ttsAudio.play()
        .then(() => { barEl.classList.add('playing'); playBtn.textContent = '■' })
        .catch(e => console.error('[TTS] 恢复播放失败:', e))
    } else {
      _ttsAudio.pause()
      barEl.classList.remove('playing')
      playBtn.textContent = '▶'
    }
    return
  }
  // Stop previous
  if (_ttsAudio) {
    _ttsAudio.pause()
    if (_ttsBar) {
      _ttsBar.classList.remove('playing')
      const pb = _ttsBar.querySelector('.voice-play-btn')
      if (pb) pb.textContent = '▶'
    }
    _ttsAudio = null; _ttsBar = null
  }
  const url = barEl.dataset.audioUrl
  console.log('[TTS] 开始播放 url:', url ? url.slice(0, 50) + '…' : 'null')
  if (!url) { console.warn('[TTS] audioUrl 为空，无法播放'); return }
  const audio = new Audio(url)
  _ttsAudio = audio; _ttsBar = barEl
  barEl.classList.add('playing')
  playBtn.textContent = '■'
  audio.play()
    .then(() => console.log('[TTS] 播放中'))
    .catch(e => {
      console.error('[TTS] 播放失败:', e)
      barEl.classList.remove('playing')
      playBtn.textContent = '▶'
      _ttsAudio = null; _ttsBar = null
    })
  audio.onended = () => {
    console.log('[TTS] 播放结束')
    barEl.classList.remove('playing')
    playBtn.textContent = '▶'
    _ttsAudio = null; _ttsBar = null
  }
  audio.onerror = e => {
    console.error('[TTS] 音频错误:', e, audio.error)
    barEl.classList.remove('playing')
    playBtn.textContent = '▶'
    _ttsAudio = null; _ttsBar = null
  }
}

async function addTtsBar(text, wrapEl) {
  if (!text || isSticker(text)) {
    console.log('[TTS] 跳过：', text ? '贴纸' : '空文本')
    return
  }
  const trimmed = text.slice(0, 500)  // ElevenLabs accepts up to 500 chars
  console.log('[TTS] 请求语音，文本长度:', trimmed.length)
  try {
    const r = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: trimmed }),
    })
    console.log('[TTS] 响应 status:', r.status, 'content-type:', r.headers.get('content-type'))
    if (!r.ok) {
      const errText = await r.text().catch(() => '')
      console.warn('[TTS] 接口失败:', r.status, errText)
      return
    }
    const blob = await r.blob()
    console.log('[TTS] blob 大小:', blob.size, '类型:', blob.type)
    if (blob.size === 0) { console.warn('[TTS] 收到空 blob'); return }

    const url = URL.createObjectURL(blob)
    console.log('[TTS] ObjectURL 创建成功')

    const col = wrapEl.querySelector('.col')
    if (!col) { console.warn('[TTS] 找不到 .col'); return }

    const dur = Math.max(1, Math.round(trimmed.length / 7))
    console.log('[TTS] 预估时长:', dur, '秒')

    const bar = document.createElement('div')
    bar.className = 'voice-bar'
    bar.dataset.audioUrl = url
    bar.innerHTML =
      '<button class="voice-play-btn">▶</button>' +
      '<div class="voice-waves"><span></span><span></span><span></span><span></span><span></span></div>' +
      `<span class="voice-dur">${dur}"</span>`
    bar.onclick = () => playVoiceBar(bar)

    const tsEl = col.querySelector('.ts')
    if (tsEl) col.insertBefore(bar, tsEl)
    else col.appendChild(bar)
    msgsEl.scrollTop = msgsEl.scrollHeight
    console.log('[TTS] 语音条已插入，parent:', col.className)
  } catch (e) {
    console.error('[TTS] 出错:', e)
  }
}
