services:
  - type: web
    name: ghost
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ghost:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false       # 在 Render 控制台手动填写，不写进代码
      - key: PYTHONIOENCODING
        value: utf-8
      - key: LANG
        value: en_US.UTF-8
    healthCheckPath: /
